name: AccountsService CI

on:
  push:
    branches: [ mainline ]
  pull_request:
    branches: [ mainline ]
  workflow_dispatch:

jobs:
  build-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accounts_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNTS_TEST_DB_URL: jdbc:postgresql://localhost:5432/accounts_test
      ACCOUNTS_TEST_DB_USER: postgres
      ACCOUNTS_TEST_DB_PASSWORD: ci-local-only
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout the Source code
        uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: '16.x'
          java-package: jdk
          architecture: x64
      - name: Run release script
        run: ./gradlew release -Pskip-functional-tests --no-daemon --max-workers=1
      - name: Verify PostgreSQL regression executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'accounts-service/build/test-results/test/TEST-com.mgl.accountsservice.dao.mappers.SubAccountsMapperDatabaseTests.xml'
          result = ET.parse(path).getroot()
          counts = {key: int(result.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('PostgreSQL mapper regression:', counts)
          assert counts['tests'] > 0 and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped')), counts
          PY
